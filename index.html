<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="new-todo-form" class="new-todo" autocomplete="off">
      <input id="new-todo-title" type="text" placeholder="やることを入力して Enter" maxlength="200" required autofocus>
      <input id="new-todo-due" type="date" aria-label="期限（任意）" title="期限（任意）">
      <button type="submit">追加</button>
    </form>

    <section id="main" class="main" hidden>
      <div class="toolbar">
        <label class="toggle-all">
          <input id="toggle-all" type="checkbox">
          すべて完了にする
        </label>
        <nav class="filters" aria-label="絞り込み">
          <a href="#/" data-filter="all">すべて</a>
          <a href="#/active" data-filter="active">未完了</a>
          <a href="#/completed" data-filter="completed">完了済み</a>
        </nav>
      </div>

      <ul id="todo-list" class="todo-list"></ul>

      <footer class="footer">
        <span id="todo-count"></span>
        <button id="clear-completed" type="button" class="link-button">完了済みを削除</button>
      </footer>
    </section>

    <p id="empty" class="empty">TODO はまだありません。</p>
    <p class="hint">ダブルクリックで編集（Enter で確定 / Esc で取消）</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
